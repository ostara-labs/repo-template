[project]
name = "my-package"
version = "0.3.0"
description = "Placeholder package - rename me."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_package"]
