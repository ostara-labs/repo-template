# Pre-commit hook configuration for the repo-template monorepo.
# Install with: make hooks  (or: pre-commit install)
# Hook types: pre-commit (file checks), commit-msg (conventional commits),
# pre-push (branch protection).

default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Respect markdown line-break double spaces.
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commits
        name: check conventional commit message
        language: system
        entry: 'bash -c ''line=$(head -n1 "$1"); if echo "$line" | grep -qE "^(Merge |Revert |fixup! )" || { [ ${#line} -le 100 ] && echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?(!)?: (.{1,})$"; }; then exit 0; else echo "Commit message must follow Conventional Commits (type(scope)!: subject, <=100 chars)" >&2; exit 1; fi'' --'
        stages: [commit-msg]
        always_run: true
