# CodeRabbit configuration - https://docs.coderabbit.ai/reference/configuration
# Free forever on public repositories. Reviews are advisory: they never
# replace human approval on trust-boundary paths (see CODEOWNERS).

language: en-US
early_access: false

reviews:
  profile: chill # assertive flags more; chill keeps signal-to-noise high
  request_changes_workflow: false # reviews must not block merges by themselves
  high_level_summary: true
  review_status: true
  poem: false
  # Docs-drift semantic layer: the CI check (docs/DOC_MAP.yml) enforces
  # that mapped docs CHANGE with the code; these instructions review that
  # they actually MATCH — content drift a script cannot see.
  path_instructions:
    - path: "**/src/**"
      instructions: >-
        If a change alters behavior, thresholds, schemas, workflows or
        public contracts, verify the docs mapped in docs/DOC_MAP.yml
        reflect the new reality. Flag mapped docs that were touched only
        cosmetically (typo fixes, version bumps) while the substance they
        describe changed, and doc-worthy surfaces that are mapped nowhere.
    - path: "elixir/lib/**"
      instructions: >-
        If a change alters behavior, thresholds, schemas, workflows or
        public contracts, verify the docs mapped in docs/DOC_MAP.yml
        reflect the new reality. Flag mapped docs that were touched only
        cosmetically (typo fixes, version bumps) while the substance they
        describe changed, and doc-worthy surfaces that are mapped nowhere.
  path_filters:
    # Generated by package managers - never review machine-resolved output.
    - "!**/Cargo.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/mix.lock"
    - "!**/uv.lock"
    # Generated by release-please on every release.
    - "!**/CHANGELOG.md"
    # Build outputs and caches (gitignored, excluded defensively in case
    # one ever gets committed by a script gone wrong).
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/target/"
    - "!**/_build/"
    - "!**/deps/"
    - "!**/__pycache__/"
    - "!**/.pytest_cache/"
    - "!**/.ruff_cache/"
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
