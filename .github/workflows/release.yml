name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # GITHUB_TOKEN cannot create pull requests when the org disables
          # "Allow GitHub Actions to create and approve pull requests".
          # Escape hatch: store a fine-grained PAT/App token (contents:write,
          # pull-requests:write) as the RELEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
