# Docs-drift map — enforced by the docs-drift CI check (engine lives in
# the .devtools submodule). A rule says: when code matching `paths`
# changes, at least one of `docs` must change in the same PR. Deliberate
# bypass: the `no-docs` label (the bypass is posted loudly as a PR
# comment — never silent).
#
# A mapped doc that does not exist blocks the PR as MISSING: create it.
# Editing this map does NOT satisfy a MISSING finding.
#
# The template ships no rules: a template has no domain. Uncomment and
# adapt as the project grows — keep it small and high-signal (2-6 rules;
# false positives train people to bypass). To calibrate a new rule
# without blocking, pass warn: true on the docs-drift job in
# .github/workflows/ci.yml for a week, then remove it.

rules: []
#  - name: data model
#    paths: ["python/src/*/app/db/models/**"]
#    docs: [docs/domain/entity-relationships.md, docs/domain/glossary.md]
#  - name: api surface
#    paths: ["python/src/*/app/**/router*.py"]
#    docs: [docs/processes/api.md]

# Paths that never trigger the check.
exempt:
  - "**/tests/**"
  - "**/*.test.*"
  - "**/__pycache__/**"
  - "**/__snapshots__/**"
